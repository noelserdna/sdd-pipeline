<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estado del proyecto</title>
<style>
/* Layout: one reading column (64rem) under a sticky section bar; the customer's own words set in serif,
   everything we report in sans; evidence sits inside each requirement card, ids stay small as anchors. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #eaeef2;
  --ink: #17202b;
  --muted: #566170;
  --line: #d6dde4;
  --accent: #2c3f8f;
  --accent-soft: #e4e8f7;
  --ok: #1d6f45;      --ok-bg: #e1f1e7;
  --build: #0b5f7a;   --build-bg: #def0f6;
  --warn: #7a5100;    --warn-bg: #faeed3;
  --bad: #ad2a20;     --bad-bg: #fbe3e0;
  --defer: #5d4a86;   --defer-bg: #ece6f6;
  --idle: #5f6874;    --idle-bg: #e7ebef;
  --font-voice: "Iowan Old Style", "Charter", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #161d25; --surface-2: #1d2630; --ink: #e5eaf0; --muted: #9ba7b4; --line: #2b3643;
    --accent: #a4b4ff; --accent-soft: #1f2849;
    --ok: #6fd3a0; --ok-bg: #11301f; --build: #74cbe8; --build-bg: #0f2c38; --warn: #f0c46a; --warn-bg: #33280f;
    --bad: #ff9389; --bad-bg: #3b1714; --defer: #c6b6ec; --defer-bg: #272038; --idle: #a3adb8; --idle-bg: #222b35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #161d25; --surface-2: #1d2630; --ink: #e5eaf0; --muted: #9ba7b4; --line: #2b3643;
  --accent: #a4b4ff; --accent-soft: #1f2849;
  --ok: #6fd3a0; --ok-bg: #11301f; --build: #74cbe8; --build-bg: #0f2c38; --warn: #f0c46a; --warn-bg: #33280f;
  --bad: #ff9389; --bad-bg: #3b1714; --defer: #c6b6ec; --defer-bg: #272038; --idle: #a3adb8; --idle-bg: #222b35;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--font-body);
  padding-inline: 16px; padding-block: 0 4rem;
  overflow-wrap: anywhere;
}
.wrap { max-width: 64rem; margin-inline: auto; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, summary:focus-visible, video:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px;
}
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.2; margin: 0; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
img { max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.id { font: 500 0.72rem/1 var(--font-mono); color: var(--muted); text-decoration: none; letter-spacing: 0.02em; white-space: nowrap; }
a.id:hover { color: var(--accent); text-decoration: underline; }
.small { font-size: 0.875rem; color: var(--muted); }
.eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Header and sticky bar */
.masthead { padding-block: 2.25rem 1.25rem; display: grid; gap: 0.4rem; }
.masthead h1 { font: 600 clamp(1.6rem, 4vw, 2.3rem)/1.15 var(--font-body); letter-spacing: -0.01em; }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: -16px; padding-inline: 16px;
}
.bar-inner { max-width: 64rem; margin-inline: auto; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; padding-block: 0.45rem; }
.toc { display: flex; gap: 0.25rem; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1 1 20rem; }
.toc::-webkit-scrollbar { display: none; }
.toc a { white-space: nowrap; text-decoration: none; color: var(--muted); font-size: 0.875rem; padding: 0.3rem 0.55rem; border-radius: 6px; }
.toc a:hover { color: var(--ink); background: var(--surface-2); }
.filter { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
.chip-btn {
  font: inherit; font-size: 0.8125rem; cursor: pointer; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 0.25rem 0.65rem; border-radius: 999px;
}
@media (max-width: 720px) { .bar { position: static; } }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

/* Sections */
section.block { padding-block: 2.75rem 0.5rem; scroll-margin-top: 3.5rem; display: grid; gap: 1.25rem; }
.block > header { display: grid; gap: 0.35rem; }
.block > header h2 { font: 600 1.45rem/1.2 var(--font-body); }
.block > header p { color: var(--muted); max-width: 42rem; }
.empty {
  border: 1px dashed var(--line); border-radius: var(--radius); padding: 1.1rem 1.2rem; color: var(--muted);
  background: var(--surface); max-width: 46rem;
}
.empty strong { color: var(--ink); display: block; margin-bottom: 0.2rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.15rem 1.25rem; min-width: 0; }

/* Status pills */
.pill {
  display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8125rem; font-weight: 600;
  padding: 0.18rem 0.55rem 0.18rem 0.45rem; border-radius: 999px; white-space: nowrap;
  color: var(--tone, var(--idle)); background: var(--tone-bg, var(--idle-bg));
}
.pill svg { flex: none; }
.t-ok { --tone: var(--ok); --tone-bg: var(--ok-bg); }
.t-build { --tone: var(--build); --tone-bg: var(--build-bg); }
.t-warn { --tone: var(--warn); --tone-bg: var(--warn-bg); }
.t-bad { --tone: var(--bad); --tone-bg: var(--bad-bg); }
.t-defer { --tone: var(--defer); --tone-bg: var(--defer-bg); }
.t-idle { --tone: var(--idle); --tone-bg: var(--idle-bg); }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 1. Where we are */
.lede { font: 400 clamp(1.45rem, 3.4vw, 2.1rem)/1.25 var(--font-voice); max-width: 44rem; text-wrap: pretty; }
.rail { list-style: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; counter-reset: none; }
.rail li { position: relative; display: grid; justify-items: center; text-align: center; gap: 0.45rem; padding-inline: 0.2rem; }
.rail li::before {
  content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0;
}
.rail li:first-child::before { display: none; }
.rail li[data-state="done"]::before, .rail li[data-state="current"]::before { background: var(--accent); }
.rail .dot {
  position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--bg); border: 2px solid var(--line); color: var(--surface);
}
.rail li[data-state="done"] .dot { background: var(--accent); border-color: var(--accent); }
.rail li[data-state="current"] .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.rail li[data-state="current"] .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.rail li[data-state="skipped"] .dot { border-style: dashed; color: var(--muted); }
.rail .lbl { font-size: 0.8125rem; line-height: 1.25; color: var(--muted); }
.rail li[data-state="current"] .lbl { color: var(--ink); font-weight: 650; }
.rail li[data-state="done"] .lbl { color: var(--ink); }
.rail li[data-state="skipped"] .lbl { text-decoration: line-through; text-decoration-color: var(--muted); }
.rail .st { font-size: 0.6875rem; color: var(--muted); }
.skip-notes { display: grid; gap: 0.35rem; font-size: 0.875rem; color: var(--muted); max-width: 46rem; }
.skip-notes b { color: var(--ink); font-weight: 600; }
@media (max-width: 720px) {
  .rail { grid-template-columns: 1fr; gap: 0.15rem; }
  .rail li { grid-template-columns: 24px 1fr; justify-items: start; text-align: left; align-items: center; column-gap: 0.75rem; padding: 0.2rem 0; }
  .rail li::before { left: 11px; top: -50%; width: 2px; height: 100%; }
  .rail .st { grid-column: 2; margin-top: -0.4rem; }
}
.nownext { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
.nownext .card { display: grid; gap: 0.35rem; align-content: start; }
.ask { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 1.15rem 1.25rem; display: grid; gap: 0.6rem; }
.ask h3 { font-size: 1.1rem; color: var(--ink); }
.ask ol { padding-left: 1.3rem; display: grid; gap: 0.45rem; }
.ask li::marker { color: var(--accent); font-weight: 700; }
.tally { display: grid; gap: 0.5rem; }
.tally-bar { display: flex; gap: 2px; height: 12px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.tally-bar span { display: block; background: var(--tone); min-width: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; font-size: 0.8125rem; color: var(--muted); list-style: none; }
.legend li { display: inline-flex; align-items: center; gap: 0.35rem; }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--tone); display: inline-block; }
.legend b { color: var(--ink); font-weight: 600; }
.note-comments { font-size: 0.875rem; color: var(--muted); }

/* 2. Needs */
.needs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 1rem; }
.need { display: grid; gap: 0.7rem; align-content: start; scroll-margin-top: 4rem; }
.need blockquote { margin: 0; font: 400 1.25rem/1.4 var(--font-voice); color: var(--ink); }
.need blockquote { quotes: "\201C" "\201D"; }
:lang(es) .need blockquote { quotes: "\00AB" "\00BB"; }
.need blockquote::before { content: open-quote; }
.need blockquote::after { content: close-quote; }
.need cite { font-style: normal; font-size: 0.875rem; color: var(--muted); }
.need .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; }
.need .decision { font-size: 0.9rem; border-left: 3px solid var(--line); padding-left: 0.7rem; color: var(--muted); }
.linklist { list-style: none; display: grid; gap: 0.3rem; font-size: 0.9rem; }
.linklist li { display: flex; gap: 0.45rem; align-items: baseline; }
.linklist .pill { padding: 0.05rem 0.3rem; }
:target { animation: none; }
.card:target, .need:target { outline: 3px solid var(--accent); outline-offset: 3px; }

/* 3. Requirements */
.group { display: grid; gap: 1rem; }
.group > h3 { font-size: 1.1rem; display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; }
.group > h3 small { font-weight: 400; font-size: 0.9rem; color: var(--muted); }
.req { display: grid; gap: 1rem; scroll-margin-top: 4rem; }
.req[data-status="deprecated"] { opacity: 0.72; }
.req-top { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: center; }
.req-top .id { margin-left: auto; }
.prio { font-size: 0.8125rem; color: var(--muted); }
.prio b { color: var(--ink); font-weight: 600; }
.req-head { display: grid; gap: 0.3rem; max-width: 46rem; }
.req-head h4 { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
.req-head .plain { font-size: 1.125rem; line-height: 1.5; }
.req-head h4.plain.is-title { font-weight: 600; color: var(--ink); font-size: 1.125rem; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 0.3rem 1rem; font-size: 0.9rem; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { .facts { grid-template-columns: 1fr; } .facts dd { margin-bottom: 0.4rem; } }
.criteria { list-style: none; display: grid; gap: 0.75rem; }
.crit { border-top: 1px solid var(--line); padding-top: 0.85rem; display: grid; gap: 0.6rem; }
.crit-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.crit-head .eyebrow { margin-right: 0.25rem; }
.crit-text { max-width: 46rem; }
.crit-text .kw { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.evid { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-start; }
.thumb {
  padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); cursor: zoom-in;
  width: 11rem; max-width: 100%; aspect-ratio: 4 / 3; overflow: hidden; display: block;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
.missing {
  width: 11rem; max-width: 100%; aspect-ratio: 4 / 3; border: 1.5px dashed var(--tone, var(--line)); border-radius: 8px;
  display: grid; place-items: center; text-align: center; padding: 0.6rem; font-size: 0.8125rem; color: var(--tone, var(--muted));
  background: var(--tone-bg, transparent);
}
.proof { display: grid; gap: 0.35rem; font-size: 0.9rem; min-width: 0; flex: 1 1 14rem; }
.proof-line { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
.meter { display: inline-block; width: 6rem; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; vertical-align: middle; }
.meter > span { display: block; height: 100%; background: var(--tone, var(--accent)); border-radius: 3px; }
.measure { display: grid; gap: 0.35rem; max-width: 22rem; }
.measure > svg { width: 100%; height: 34px; display: block; overflow: visible; }
.measure .track { fill: var(--surface-2); }
.measure .val { fill: var(--tone); }
.measure .lim { stroke: var(--ink); stroke-width: 2; }
.measure text { fill: var(--muted); font: 11px var(--font-body); }
.videos { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); }
figure.vid { margin: 0; display: grid; gap: 0.3rem; }
figure.vid video { width: 100%; max-width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16 / 10; }
figure.vid figcaption { font-size: 0.8125rem; color: var(--muted); }
.warnings { list-style: none; display: grid; gap: 0.5rem; }
.warnings li {
  display: grid; grid-template-columns: 18px 1fr; gap: 0.15rem 0.55rem; padding: 0.6rem 0.75rem; border-radius: 8px;
  background: var(--tone-bg); color: var(--ink); border: 1px solid var(--tone);
}
.warnings li svg { color: var(--tone); margin-top: 3px; }
.warnings li strong { font-weight: 600; }
.warnings li .tech { grid-column: 2; font: 0.75rem/1.4 var(--font-mono); color: var(--muted); }
.waiver { border: 1px solid var(--defer); background: var(--defer-bg); border-radius: 8px; padding: 0.75rem 0.9rem; display: grid; gap: 0.3rem; }
.waiver strong { color: var(--defer); }
.req-foot { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.8125rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 0.7rem; }
.req-foot a.sha { font-family: var(--font-mono); }

/* 4. Deliveries */
.fase { display: grid; gap: 1rem; scroll-margin-top: 4rem; }
.fase-top { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: center; }
.fase-top .id { margin-left: auto; }
.fase h3 { font-size: 1.25rem; }
.fase .increment { font-size: 1.05rem; max-width: 46rem; }
.fase-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap: 1.25rem; }
.fase-cols > div { display: grid; gap: 0.5rem; align-content: start; min-width: 0; }
.steps { padding-left: 1.4rem; display: grid; gap: 0.45rem; font-size: 0.95rem; }
.steps li::marker { font-variant-numeric: tabular-nums; color: var(--muted); }
.steps .exp { display: block; color: var(--muted); font-size: 0.875rem; }
.progress { display: grid; gap: 0.3rem; font-size: 0.9rem; }
.progress .meter { width: 100%; height: 8px; }
.accepted { font-size: 0.95rem; }

/* 5. Journal */
.days { display: grid; gap: 1.5rem; }
.day h3 { font-size: 0.95rem; font-weight: 600; color: var(--muted); padding-bottom: 0.4rem; border-bottom: 1px solid var(--line); margin-bottom: 0.6rem; }
.entries { list-style: none; display: grid; gap: 0.75rem; }
.entry { display: grid; grid-template-columns: 4.4rem 28px 1fr; gap: 0.6rem; align-items: start; }
.entry time { font-size: 0.8125rem; color: var(--muted); padding-top: 4px; font-variant-numeric: tabular-nums; }
.entry .kind { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--tone); background: var(--tone-bg); }
.entry .body { display: grid; gap: 0.2rem; min-width: 0; }
.entry .meta { font-size: 0.8125rem; color: var(--muted); display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; }
.entry.derived .text { color: var(--muted); }
.entry.derived .kind { background: transparent; border: 1px dashed var(--line); color: var(--muted); }

/* 6. Features */
.features { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 1rem; }
.feature { display: grid; gap: 0.6rem; align-content: start; }
.feature h3 { font-size: 1.1rem; }
.feature .counts { font-size: 0.875rem; color: var(--muted); }
.feature[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* 7. Technical */
details.tech { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.tech > summary { cursor: pointer; padding: 1rem 1.25rem; font-weight: 600; }
details.tech > .inner { padding: 0 1.25rem 1.25rem; display: grid; gap: 1.25rem; }
.tech h3 { font-size: 0.95rem; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.8125rem; }
th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; white-space: nowrap; }
td code, .mono { font-family: var(--font-mono); font-size: 0.78rem; }

/* 8. Glossary */
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 0.9rem 2rem; margin: 0; }
.gloss div { display: grid; gap: 0.15rem; align-content: start; }
.gloss dt { font-weight: 600; }
.gloss dd { margin: 0; color: var(--muted); font-size: 0.925rem; }

footer.foot { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 0.8125rem; color: var(--muted); }

/* Lightbox */
dialog.lb { border: 0; padding: 0; background: var(--surface); color: var(--ink); border-radius: var(--radius); max-width: min(96vw, 70rem); max-height: 92vh; }
dialog.lb::backdrop { background: rgba(8, 12, 16, 0.72); }
dialog.lb .lb-in { display: grid; gap: 0.6rem; padding: 0.75rem; }
dialog.lb img { max-height: 78vh; width: auto; margin-inline: auto; display: block; border-radius: 6px; }
dialog.lb .lb-bar { display: flex; gap: 1rem; align-items: center; justify-content: space-between; font-size: 0.875rem; }
dialog.lb button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 6px; padding: 0.3rem 0.8rem; }

/* No data */
.nodata { max-width: 40rem; margin: 4rem auto; display: grid; gap: 0.8rem; }
.nodata h1 { font: 400 2rem/1.2 var(--font-voice); }
.nodata code { font-family: var(--font-mono); font-size: 0.85em; background: var(--surface-2); padding: 0.1rem 0.3rem; border-radius: 4px; }

@media print {
  body { background: #fff; color: #000; padding: 0; }
  .bar, dialog, .chip-btn, .filter { display: none !important; }
  section.block { padding-block: 1.5rem 0; }
  .card, .need, .req, .fase, .entry { break-inside: avoid; }
  a { color: inherit; }
  video { display: none; }
  figure.vid figcaption::before { content: "\25B6  "; }
}
</style>

        h("h3", { text: f.title || "" }),
        f.increment ? h("p", { class: "increment", text: f.increment }) : null);

      var left = h("div", null, h("span", { class: "eyebrow", text: L.includes }), h("ul", { class: "linklist" }, arr(f.requirements).map(reqLink)));
      var demo = arr(f.demo);
      var mid = h("div", null, h("span", { class: "eyebrow", text: L.demoH }),
        demo.length ? h("ol", { class: "steps" }, demo.map(function (s) {
          return h("li", null, s.action, s.expected ? h("span", { class: "exp", text: "→ " + s.expected }) : null);
        })) : h("p", { class: "small", text: L.empty.demo }));
      var t = f.tasks || { done: 0, total: 0 };
      var right = h("div", null, h("span", { class: "eyebrow", text: L.tasksH }),
        t.total ? h("div", { class: "progress " + (t.done === t.total ? "t-ok" : "t-build") },
          h("span", { class: "num", text: fmt(L.tasks, { done: t.done, total: t.total }) }),
          h("span", { class: "meter", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(t.total), "aria-valuenow": String(t.done), "aria-label": L.tasksH },
            h("span", { style: "width:" + Math.round(100 * t.done / t.total) + "%" }))) : h("p", { class: "small", text: "—" }),
        f.acceptance ? h("p", { class: "accepted" }, icon("flag"), " ",
          fmt(L.acceptedBy, { by: f.acceptance.by || "", role: f.acceptance.role ? " (" + f.acceptance.role + ")" : "", date: fDate(f.acceptance.at) }),
          f.acceptance.channel ? ", " + fmt(L.via, { channel: f.acceptance.channel }) : "", ".") : null,
        f.issue ? h("p", { class: "small" }, ext(f.issue.url, fmt(L.issue, { n: f.issue.number }))) : null,
        arr(f.tags).length ? h("p", { class: "small" }, arr(f.tags).map(function (tg, i) { return [i ? " · " : "", ext(tg.url, tg.name, "id")]; })) : null);
      card.appendChild(h("div", { class: "fase-cols" }, left, mid, right));
      var vids = arr(f.videos).map(videoEl).filter(Boolean);
      if (vids.length) card.appendChild(h("div", { class: "videos" }, vids));
      var mv = arr(f.missingVideos);
      if (mv.length) card.appendChild(h("ul", { class: "warnings" }, h("li", { class: WARN_TONE.missing_video },
        icon("alert"), h("span", null, h("strong", { text: L.warn.missing_video })), h("span", { class: "tech", text: mv.join(", ") }))));
      sec.appendChild(card);
    });
    return fixHead(sec);
  }

  /* ---------- 5. Journal ---------- */
  function refLink(ref) {
    return h("a", { href: "#" + ref, class: "id", text: ref });
  }
  function renderJournal() {
    var sec = section("s-journal"); sec.appendChild(sectionHead("journal"));
    var all = arr(D.journal);
    if (!all.length) { sec.appendChild(emptyBox(L.empty.journal)); return fixHead(sec); }
    var list = all.filter(function (j) { return inFeature(j.feature); })
      .map(function (j, i) { return { j: j, d: parseDate(j.at), i: i }; })
      .sort(function (a, b) { return ((b.d ? b.d.getTime() : 0) - (a.d ? a.d.getTime() : 0)) || (b.i - a.i); });
    if (!list.length) { sec.appendChild(h("p", { class: "empty", text: L.empty.filtered })); return fixHead(sec); }
    var days = h("div", { class: "days" }), cur = null, ul = null;
    var dayFmt = new Intl.DateTimeFormat(lang, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    list.forEach(function (x) {
      var key = x.d ? dayFmt.format(x.d) : "—";
      if (key !== cur) { cur = key; ul = h("ul", { class: "entries" }); days.appendChild(h("div", { class: "day" }, h("h3", { text: key.charAt(0).toUpperCase() + key.slice(1) }), ul)); }
      var j = x.j, tone = KIND_TONE[j.kind] || "t-idle";
      var refs = arr(j.refs);
      ul.appendChild(h("li", { class: "entry" + (j.derived ? " derived" : "") },
        h("time", { datetime: j.at || "", text: x.d ? fTime(x.d) : "" }),
        h("span", { class: "kind " + tone, title: L.kinds[j.kind] || j.kind }, icon(KIND_ICON[j.kind] || "ring")),
        h("div", { class: "body" },
          h("p", { class: "text" }, h("span", { class: "sr", text: (L.kinds[j.kind] || j.kind) + ": " }), j.text || ""),
          h("div", { class: "meta" },
            h("span", { text: L.kinds[j.kind] || j.kind }),
            j.by ? h("span", { text: fmt(L.by, { by: j.by }) }) : null,
            j.derived ? h("span", { text: L.derived }) : null,
            refs.length ? h("span", null, refs.map(function (r, i) { return [i ? " " : "", refLink(r)]; })) : null))));
    });
    sec.appendChild(days);
    return fixHead(sec);
  }

  /* ---------- 6. Features ---------- */
  function featureTitle(id) {
    var f = arr(D.features).filter(function (x) { return x.id === id; })[0];
    return f ? f.title : (id === "initial" ? L.initialFeature : id);
  }
  function renderFeatures() {
    var sec = section("s-features"); sec.appendChild(sectionHead("features"));
    var feats = arr(D.features);
    if (!feats.length) { sec.appendChild(emptyBox(L.empty.features)); return fixHead(sec); }
    var grid = h("div", { class: "features" });
    feats.forEach(function (f) {
      var needs = arr(D.needs).filter(function (n) { return n.feature === f.id; }).length;
      var reqs = arr(D.requirements).filter(function (r) { return r.feature === f.id && r.status !== "deprecated"; });
      var shown = reqs.filter(function (r) { return r.status === "shown"; }).length;
      var active = state.feature === f.id;
      grid.appendChild(h("article", { class: "card feature", id: "F-" + f.id, "aria-current": active ? "true" : null },
        h("h3", { text: f.title || f.id }),
        f.createdAt ? h("p", { class: "small", text: fmt(L.since, { date: fDate(f.createdAt) }) }) : null,
        f.summary ? h("p", { text: f.summary }) : null,
        h("p", { class: "counts num", text: fmt(L.featureCounts, { needs: needs, reqs: reqs.length, shown: shown }) }),
        feats.length > 1 ? h("div", null, h("button", { type: "button", class: "chip-btn", "aria-pressed": active ? "true" : "false",
          onclick: function () { setFilter(active ? "all" : f.id); } }, active ? L.filterAll : L.filterOnly)) : null));
    });
    sec.appendChild(grid);
    if (feats.length < 2) sec.appendChild(h("p", { class: "small", text: L.empty.features[1] }));
    return fixHead(sec);
  }

  /* ---------- 7. Technical details ---------- */
  function table(cols, rows) {
    return h("div", { class: "scroll" }, h("table", null,
      h("thead", null, h("tr", null, cols.map(function (c) { return h("th", { scope: "col", text: c }); }))),
      h("tbody", null, rows.map(function (r) { return h("tr", null, r.map(function (c) { return h("td", null, c); })); }))));
  }
  function commitUrl(sha) {
    var repo = D.project && D.project.repo;
    if (!repo || !repo.web || !sha) return null;
    if (repo.provider === "github") return repo.web.replace(/\/$/, "") + "/commit/" + sha;
    if (repo.provider === "gitlab") return repo.web.replace(/\/$/, "") + "/-/commit/" + sha;
    return null;
  }
  function renderTech() {
    var sec = section("s-tech"); sec.appendChild(sectionHead("tech"));
    var T = D.technical || {}, tl = L.t;
    var inner = h("div", { class: "inner" });
    var sha = T.sha || D.sha;
    var gen = [];
    if (sha) gen.push([tl.version, ext(commitUrl(sha), String(sha).slice(0, 12), "mono")]);
    if (T.gate) gen.push([tl.gate, h("span", null, h("span", { class: "mono", text: "exit " + T.gate.code }), " · " + (T.gate.label || ""))]);
    if (T.report) gen.push([tl.report, h("span", { class: "mono", text: T.report })]);
    if (D.evidence && D.evidence.pack) gen.push([tl.pack, h("span", { class: "mono", text: D.evidence.pack })]);
    if (D.page && D.page.url) gen.push([tl.page, ext(D.page.url, D.page.url, "mono")]);
    if (gen.length) inner.appendChild(table(["", ""], gen));

    var reqs = arr(D.requirements);
    if (reqs.length) inner.appendChild(h("div", null, h("h3", { text: tl.reqs }), table([tl.cId, tl.cStatus, tl.cCommits, tl.cTests], reqs.map(function (r) {
      var names = [];
      arr(r.criteria).forEach(function (c) { arr(c.tests && c.tests.names).forEach(function (n) { names.push(n); }); });
      return [h("a", { href: "#" + r.id, class: "mono", text: r.id }), L.reqStatus[r.status] || r.status,
        arr(r.links && r.links.commits).map(function (c, i) { return [i ? h("br") : null, ext(c.url, c.sha, "mono"), " ", c.subject || ""]; }),
        names.map(function (n, i) { return [i ? h("br") : null, h("code", { text: n })]; })];
    }))));

    var tags = arr(T.tags);
    if (tags.length) inner.appendChild(h("div", null, h("h3", { text: tl.tags }), table([tl.cName, tl.cDate], tags.map(function (t) {
      return [ext(t.url, t.name, "mono"), fDate(t.date)];
    }))));
    var pipe = arr(T.pipeline);
    if (pipe.length) inner.appendChild(h("div", null, h("h3", { text: tl.pipeline }), table([tl.cStage, tl.cStatus, tl.cLast], pipe.map(function (p) {
      return [h("code", { text: p.stage }), h("code", { text: p.status }), p.lastRun ? fDateTime(p.lastRun) : tl.none];
    }))));
    var files = arr(D.evidence && D.evidence.files);
    if (files.length) inner.appendChild(h("div", null, h("h3", { text: tl.files }), table([tl.cPath, tl.cKind, tl.cSize, tl.cCrit, tl.cPub], files.map(function (f) {
      return [h("code", { text: f.path }), f.kind || "", h("span", { class: "num", text: fBytes(f.bytes) }), arr(f.criteria).join(", "),
        f.published ? tl.yes : tl.no + (f.reason ? " (" + f.reason + ")" : "")];
    }))));
    sec.appendChild(h("details", { class: "tech", id: "tech-details" }, h("summary", { text: L.s.tech.h }), inner));
    return fixHead(sec);
  }

  /* ---------- 8. Glossary ---------- */
  function renderGlossary() {
    var sec = section("s-glossary"); sec.appendChild(sectionHead("glossary"));
    sec.appendChild(h("dl", { class: "gloss" }, L.gloss.map(function (g) { return h("div", null, h("dt", { text: g[0] }), h("dd", { text: g[1] })); })));
    return fixHead(sec);
  }

  /* ---------- Shell, filter, navigation ---------- */
  function setFilter(id) {
    state.feature = id;
    try { localStorage.setItem("sdd-status-feature", id); } catch (e) { /* storage is optional */ }
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }
  function renderBar() {
    var toc = h("nav", { class: "toc", "aria-label": L.pageEyebrow },
      [["s-where", "where"], ["s-needs", "needs"], ["s-reqs", "reqs"], ["s-fases", "fases"], ["s-journal", "journal"], ["s-features", "features"], ["s-tech", "tech"], ["s-glossary", "glossary"]]
        .map(function (x) { return h("a", { href: "#" + x[0], text: L.toc[x[1]] }); }));
    var feats = arr(D.features);
    var filter = null;
    if (feats.length > 1) {
      filter = h("div", { class: "filter", role: "group", "aria-label": L.filterLabel },
        h("span", { class: "small", text: L.filterLabel + ":" }),
        h("button", { type: "button", class: "chip-btn", "aria-pressed": state.feature === "all" ? "true" : "false", onclick: function () { setFilter("all"); } }, L.filterAll),
        feats.map(function (f) {
          return h("button", { type: "button", class: "chip-btn", "aria-pressed": state.feature === f.id ? "true" : "false", onclick: function () { setFilter(f.id); } }, f.title || f.id);
        }));
    }
    return h("div", { class: "bar" }, h("div", { class: "bar-inner" }, toc, filter));
  }
  function render() {
    app.textContent = "";
    var p = D.project || {};
    var meta = fmt(L.updated, { date: fDateTime(D.generatedAt) }) + (D.sha ? " " + fmt(L.basedOn, { sha: D.sha }) : "");
    app.appendChild(h("header", { class: "masthead" }, h("span", { class: "eyebrow", text: L.pageEyebrow }), h("h1", { text: p.name || "" }), h("p", { class: "small", text: meta })));
    app.appendChild(renderBar());
    if (state.feature !== "all") app.appendChild(h("p", { class: "small", style: "padding-top:1rem" }, L.filterShowing + ": ", h("strong", { text: featureTitle(state.feature) }), " · ",
      h("button", { type: "button", class: "chip-btn", onclick: function () { setFilter("all"); } }, L.filterAll)));
    app.appendChild(renderWhere());
    app.appendChild(renderNeeds());
    app.appendChild(renderReqs());
    app.appendChild(renderFases());
    app.appendChild(renderJournal());
    app.appendChild(renderFeatures());
    app.appendChild(renderTech());
    app.appendChild(renderGlossary());
    app.appendChild(h("footer", { class: "foot", text: meta }));
  }

  /* An internal link to something the filter hides clears the filter first. */
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href^="#"]');
    if (!a || !D) return;
    var id = decodeURIComponent(a.getAttribute("href").slice(1));
    if (!id) return;
    if (!document.getElementById(id) && state.feature !== "all") {
      ev.preventDefault(); setFilter("all");
      var t = document.getElementById(id);
      if (t) { t.scrollIntoView(); try { history.replaceState(null, "", "#" + id); } catch (e) { /* ignore */ } }
    }
    if (id === "s-tech") { var d = document.getElementById("tech-details"); if (d) d.open = true; }
  });

  /* Lightbox */
  var lb = document.getElementById("lightbox");
  function openLightbox(src, alt) {
    var img = document.getElementById("lb-img");
    img.src = src; img.alt = alt;
    document.getElementById("lb-cap").textContent = alt;
    if (lb && typeof lb.showModal === "function") lb.showModal();
    else window.open(src, "_blank", "noopener");
  }
  if (lb) {
    document.getElementById("lb-close").addEventListener("click", function () { lb.close(); });
    lb.addEventListener("click", function (e) { if (e.target === lb) lb.close(); });
  }
  window.addEventListener("beforeprint", function () { var d = document.getElementById("tech-details"); if (d) d.open = true; });

  /* ---------- Boot ---------- */
  function noData(bad) {
    var nl = (navigator.language || "es").slice(0, 2) === "en" ? DICT.en : DICT.es;
    app.textContent = "";
    var marker = "<!--SDD-DATA-->";
    app.appendChild(h("div", { class: "nodata" },
      h("span", { class: "eyebrow", text: nl.pageEyebrow }),
      h("h1", { text: nl.nodata.h }),
      bad ? h("p", { text: nl.nodata.bad }) : [
        h("p", { text: nl.nodata.p1 }),
        h("p", null, h("code", { text: nl.nodata.cmd })),
        h("p", null, nl.nodata.p2.split("{marker}")[0], h("code", { text: marker }), nl.nodata.p2.split("{marker}")[1])
      ]));
  }
  function boot() {
    var node = document.getElementById("sdd-data");
    var raw = node ? node.textContent.trim() : "";
    if (!raw || raw.indexOf("SDD-DATA") !== -1 && raw.length < 40) { noData(false); return; }
    try { D = JSON.parse(raw); } catch (e) { noData(true); return; }
    if (!D || typeof D !== "object") { noData(true); return; }
    lang = D.project && DICT[D.project.lang] ? D.project.lang : "es";
    L = DICT[lang];
    document.documentElement.lang = lang;
    lb.setAttribute("aria-label", L.lbLabel);
    document.getElementById("lb-close").textContent = L.lbClose;
    NEEDS = byId(D.needs); REQS = byId(D.requirements);
    FASES = {}; arr(D.fases).forEach(function (f) { FASES[f.n] = f; });
    FILES = {}; arr(D.evidence && D.evidence.files).forEach(function (f) { FILES[f.path] = f; });
    try {
      var saved = localStorage.getItem("sdd-status-feature");
      if (saved && arr(D.features).some(function (f) { return f.id === saved; })) state.feature = saved;
    } catch (e) { /* storage is optional */ }
    render();
    if (location.hash) {
      var t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (t) t.scrollIntoView();
    }
  }
  boot();
})();
</script>
